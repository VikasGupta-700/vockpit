<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vockpit</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #e0e0e0;
      --primary: #1976d2;
      --primary-hover: #1565c0;
      --highlight: #ff9800;
      --panel-bg: #ffffff;
      --header-bg: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --surface: #1e1e1e;
        --text: #e0e0e0;
        --text-muted: #9e9e9e;
        --border: #333333;
        --primary: #90caf9;
        --primary-hover: #64b5f6;
        --highlight: #ffb74d;
        --panel-bg: #fcfcfc; /* Light panel for SVG in dark mode so D2 colors remain readable */
        --header-bg: #1e1e1e;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand .tagline {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
    }

    .breadcrumb a {
      color: var(--primary);
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .breadcrumb .sep {
      color: var(--text-muted);
    }

    .breadcrumb .current {
      font-weight: 600;
      color: var(--text);
    }

    button#zoom-out-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button#zoom-out-btn:hover:not(:disabled) {
      background: var(--border);
    }

    button#zoom-out-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      body {
        height: auto;
        overflow: auto;
      }
      main {
        flex-direction: column;
        overflow: visible;
      }
    }

    #diagram-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--panel-bg);
      cursor: grab;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #diagram-viewport:active {
      cursor: grabbing;
    }

    #diagram-content {
      transform-origin: 0 0;
      user-select: none;
    }

    #diagram-content svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .missing-notice {
      padding: 40px;
      text-align: center;
      color: #b71c1c;
      font-size: 1rem;
      background: #ffebee;
      border: 1px solid #ffcdd2;
      border-radius: 8px;
    }

    #inspector {
      width: 380px;
      max-width: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    @media (max-width: 768px) {
      #inspector {
        width: 100%;
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }

    .inspector-header h2 {
      font-size: 1.4rem;
      margin-bottom: 4px;
      color: var(--text);
    }

    .inspector-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .inspector-section h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .inspector-section p {
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .edge-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .edge-list li {
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .edge-list a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .edge-list a:hover {
      text-decoration: underline;
    }

    .contains-badge {
      display: inline-block;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--primary);
    }

    /* Highlight class for focused leaf box */
    .highlighted-box rect,
    .highlighted-box polygon,
    .highlighted-box path {
      stroke: var(--highlight) !important;
      stroke-width: 4px !important;
      filter: drop-shadow(0 0 6px rgba(255, 152, 0, 0.6)) !important;
    }

    /* ── Code modal ── */
    #code-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
    }
    #code-modal.open { display: flex; }
    #code-modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: min(90vw, 860px);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #code-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #code-modal-title { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    #code-modal-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.3rem;
      color: var(--text-muted);
      padding: 0 4px;
      line-height: 1;
    }
    #code-modal-close:hover { color: var(--text); }
    #code-modal-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 16px 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
    }
    .code-tab {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .code-tab.active { background: var(--surface); color: var(--text); }
    #code-modal-body { flex: 1; overflow: auto; padding: 0; }
    #code-modal-body pre {
      margin: 0;
      padding: 16px;
      font-family: 'Cascadia Code','Fira Code','Consolas',monospace;
      font-size: 0.82rem;
      line-height: 1.55;
      color: var(--text);
      tab-size: 4;
      white-space: pre;
      overflow-x: auto;
    }
    .code-line-num {
      display: inline-block;
      min-width: 3ch;
      margin-right: 12px;
      color: var(--text-muted);
      text-align: right;
      user-select: none;
    }
    .code-error-notice {
      padding: 24px 16px;
      color: var(--text-muted);
      font-style: italic;
    }
    .inspector-code-btn {
      display: inline-block;
      margin-top: 2px;
      padding: 3px 10px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .inspector-code-btn:hover { background: var(--primary-hover); }
    .code-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Inline code view ── */
    #diagram-viewport.code-view-mode {
      overflow: auto;
      cursor: default;
      align-items: flex-start;
      justify-content: flex-start;
    }
    .code-inline-viewer {
      min-width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }
    .code-inline-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 16px 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      background: var(--bg);
    }
    .code-inline-body { flex: 1; }
    .code-inline-body pre {
      margin: 0;
      padding: 16px;
      font-family: 'Cascadia Code','Fira Code','Consolas',monospace;
      font-size: 0.82rem;
      line-height: 1.55;
      color: var(--text);
      tab-size: 4;
      white-space: pre;
    }

    /* ── Prompt textarea ── */
    .inspector-prompt-section { margin-top: 4px; }
    .prompt-textarea {
      width: 100%;
      min-height: 90px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.875rem;
      line-height: 1.5;
      resize: vertical;
      font-family: inherit;
    }
    .prompt-textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }

    /* ── Process All Changes button ── */
    #process-all-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    #process-all-btn:hover { background: var(--primary-hover); }

    /* ── Changes modal ── */
    #changes-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
    }
    #changes-modal.open { display: flex; }
    #changes-modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: min(90vw, 860px);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #changes-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #changes-modal-title { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    #changes-modal-close {
      background: none; border: none; cursor: pointer;
      font-size: 1.3rem; color: var(--text-muted); padding: 0 4px; line-height: 1;
    }
    #changes-modal-close:hover { color: var(--text); }
    #changes-modal-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #copy-changes-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #copy-changes-btn:hover { background: var(--primary-hover); }
    #copy-confirm { font-size: 0.85rem; color: #2e7d32; }
    #changes-modal-hint { margin-left: auto; font-size: 0.8rem; color: var(--text-muted); }
    #changes-modal-body { flex: 1; overflow: auto; padding: 0; }
    #changes-modal-body pre {
      margin: 0;
      padding: 16px;
      font-family: 'Cascadia Code','Fira Code','Consolas',monospace;
      font-size: 0.82rem;
      line-height: 1.55;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
  <script src="model.js"></script>
  <script src="diagrams.js"></script>
  <script src="code.js"></script>
</head>
<body>
  <header>
    <div class="top-bar">
      <div class="brand">
        <h1>Vockpit</h1>
        <span class="tagline">You steer. AI builds.</span>
      </div>
    </div>
    <div class="nav-bar">
      <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
      <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
        <button id="process-all-btn" type="button">Process All Changes</button>
        <button id="zoom-out-btn" type="button">Zoom out</button>
      </div>
    </div>
  </header>

  <main>
    <div id="diagram-viewport">
      <div id="diagram-content"></div>
    </div>
    <aside id="inspector">
      <div id="inspector-content"></div>
    </aside>
  </main>

  <script>
    (function () {
      const model = window.VOCKPIT_MODEL;
      const svgs = window.VOCKPIT_SVG || {};

      const viewport = document.getElementById('diagram-viewport');
      const content = document.getElementById('diagram-content');
      const inspector = document.getElementById('inspector-content');
      const breadcrumb = document.getElementById('breadcrumb');
      const zoomOutBtn = document.getElementById('zoom-out-btn');

      let currentRoute = '';
      let scale = 1;
      let panX = 0;
      let panY = 0;
      let isPanning = false;
      let startMouseX = 0;
      let startMouseY = 0;
      let hasDragged = false;

      function updateTransform() {
        content.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      }

      function resetPanZoom() {
        scale = 1;
        panX = 0;
        panY = 0;
        updateTransform();
      }

      // Pan & Zoom handlers
      viewport.addEventListener('wheel', (e) => {
        if (viewport.classList.contains('code-view-mode')) return;
        e.preventDefault();
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const factor = e.deltaY < 0 ? 1.15 : 0.87;
        const newScale = Math.min(Math.max(scale * factor, 0.1), 10);

        panX = mouseX - (mouseX - panX) * (newScale / scale);
        panY = mouseY - (mouseY - panY) * (newScale / scale);
        scale = newScale;
        updateTransform();
      }, { passive: false });

      viewport.addEventListener('mousedown', (e) => {
        if (viewport.classList.contains('code-view-mode')) return;
        if (e.button === 0) {
          isPanning = true;
          hasDragged = false;
          startMouseX = e.clientX - panX;
          startMouseY = e.clientY - panY;
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (isPanning) {
          hasDragged = true;
          panX = e.clientX - startMouseX;
          panY = e.clientY - startMouseY;
          updateTransform();
        }
      });

      window.addEventListener('mouseup', () => {
        isPanning = false;
      });

      viewport.addEventListener('dblclick', (e) => {
        if (!e.target.closest('a')) {
          resetPanZoom();
        }
      });

      // Escape key: close modals first (priority: changes modal > code modal), then zoom out
      window.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape' && e.key !== 'Esc') return;
        const cm = document.getElementById('changes-modal');
        if (cm && cm.classList.contains('open')) { closeChangesModal(); return; }
        const m = document.getElementById('code-modal');
        if (m && m.classList.contains('open')) { closeCodeModal(); return; }
        handleZoomOut();
      });

      zoomOutBtn.addEventListener('click', handleZoomOut);

      function handleZoomOut() {
        const route = getRoute();
        if (!route) return; // empty route, cannot zoom out

        const node = model?.nodes?.[route];
        if (!node) {
          window.location.hash = '#/';
          return;
        }

        if (node.kind === 'system') {
          window.location.hash = '#/';
        } else if (node.kind === 'box') {
          if (node.level === 2) {
            window.location.hash = `#/${node.parent}`;
          } else if (node.level === 1) {
            window.location.hash = `#/${model.system}`;
          } else {
            window.location.hash = '#/';
          }
        } else {
          // Actor or other
          window.location.hash = '#/';
        }
      }

      function getRoute() {
        const hash = window.location.hash;
        if (!hash || hash === '#' || hash === '#/') return '';
        const raw = hash.startsWith('#/') ? hash.slice(2) : hash.slice(1);
        return decodeURIComponent(raw);
      }

      function render() {
        const route = getRoute();
        currentRoute = route;
        resetPanZoom();

        if (!model) {
          inspector.innerHTML = '<p>Error: VOCKPIT_MODEL not loaded.</p>';
          return;
        }

        const sysNode = model.nodes[model.system];

        let focusNode = null;
        let diagramToShow = 'L0_context';
        let highlightId = null;
        let isUnknown = false;

        if (!route) {
          // Empty route
          focusNode = sysNode;
          diagramToShow = 'L0_context';
        } else if (model.nodes[route]) {
          focusNode = model.nodes[route];
          if (focusNode.id === model.system) {
            diagramToShow = 'L1_system';
          } else if (focusNode.kind === 'box' && focusNode.children && focusNode.children.length > 0) {
            diagramToShow = `L2_${focusNode.id}`;
          } else if (focusNode.kind === 'box' && (!focusNode.children || focusNode.children.length === 0)) {
            diagramToShow = focusNode.diagram;
            highlightId = focusNode.id;
          } else {
            // Actor
            diagramToShow = 'L0_context';
          }
        } else {
          // Unknown ID
          isUnknown = true;
          diagramToShow = 'L0_context';
        }

        // Render Diagram
        viewport.classList.remove('code-view-mode');
        const svgContent = svgs[diagramToShow];
        if (svgContent) {
          content.innerHTML = svgContent;

          // D2 SVGs have viewBox but no width/height; set them so the SVG has intrinsic size
          const svg = content.querySelector('svg');
          if (svg && !svg.getAttribute('width') && svg.getAttribute('viewBox')) {
            const vb = svg.getAttribute('viewBox').split(/[\s,]+/);
            if (vb.length === 4) {
              svg.setAttribute('width', vb[2]);
              svg.setAttribute('height', vb[3]);
            }
          }

          // Wire SVG in-page route links and highlight
          const links = content.querySelectorAll('a');
          links.forEach((a) => {
            let href = a.getAttribute('href') || a.getAttribute('xlink:href') || '';
            // If href uses full fallback URI
            if (href.startsWith('https://vockpit.invalid/#/')) {
              href = href.replace('https://vockpit.invalid/#/', '#/');
              a.setAttribute('href', href);
            }

            if (highlightId && href.endsWith('#/' + highlightId)) {
              a.classList.add('highlighted-box');
            }
          });
        } else {
          content.innerHTML = '<div class="missing-notice">Diagram not rendered. Run "vockpit generate" with d2 installed.</div>';
        }

        // Render Breadcrumb
        renderBreadcrumb(route, focusNode, isUnknown);

        // Render Inspector
        renderInspector(route, focusNode, isUnknown);

        // Update Zoom Out button state
        zoomOutBtn.disabled = !route;
      }

      function renderBreadcrumb(route, focusNode, isUnknown) {
        if (!route) {
          breadcrumb.innerHTML = '<span class="current">Context</span>';
          return;
        }

        const items = [];
        items.push({ title: 'Context', link: '#/' });

        if (isUnknown) {
          items.push({ title: `No item '${route}'`, link: null });
        } else if (focusNode) {
          const sysNode = model.nodes[model.system];

          if (focusNode.id === sysNode.id) {
            items.push({ title: sysNode.title, link: null });
          } else if (focusNode.kind === 'box') {
            items.push({ title: sysNode.title, link: `#/${sysNode.id}` });
            if (focusNode.level === 2) {
              const parentBox = model.nodes[focusNode.parent];
              if (parentBox) {
                items.push({ title: parentBox.title, link: `#/${parentBox.id}` });
              }
            }
            items.push({ title: focusNode.title, link: null });
          } else {
            // Actor
            items.push({ title: focusNode.title, link: null });
          }
        }

        const html = items.map((it, idx) => {
          if (idx === items.length - 1 || !it.link) {
            return `<span class="current">${escapeHtml(it.title)}</span>`;
          }
          return `<a href="${it.link}">${escapeHtml(it.title)}</a>`;
        }).join(' <span class="sep">&gt;</span> ');

        breadcrumb.innerHTML = html;
      }

      function renderInspector(route, node, isUnknown) {
        if (isUnknown) {
          inspector.innerHTML = `<div class="inspector-header"><h2>Item not found</h2><p>No item with id '${escapeHtml(route)}'.</p></div>`;
          return;
        }

        if (!node) {
          inspector.innerHTML = '';
          return;
        }

        let meta = `${escapeHtml(node.id)}`;
        if (node.level !== null && node.level !== undefined) {
          meta += ` &middot; L${node.level}`;
        } else if (node.kind) {
          meta += ` &middot; ${node.kind}`;
        }

        let html = `
          <div class="inspector-header">
            <h2>${escapeHtml(node.title)}</h2>
            <div class="inspector-meta">${meta}</div>
          </div>
        `;

        if (node.summary) {
          html += `
            <div class="inspector-section">
              <p>${escapeHtml(node.summary)}</p>
            </div>
          `;
        }

        if (node.children && node.children.length > 0) {
          html += `
            <div class="inspector-section">
              <span class="contains-badge">Contains ${node.children.length} boxes</span>
            </div>
          `;
        }

        if (node.inputs && node.inputs.length > 0) {
          html += `
            <div class="inspector-section">
              <h3>Inputs</h3>
              <div class="tag-list">
                ${node.inputs.map(i => `<span class="tag">${escapeHtml(i)}</span>`).join('')}
              </div>
            </div>
          `;
        }

        if (node.outputs && node.outputs.length > 0) {
          html += `
            <div class="inspector-section">
              <h3>Outputs</h3>
              <div class="tag-list">
                ${node.outputs.map(o => `<span class="tag">${escapeHtml(o)}</span>`).join('')}
              </div>
            </div>
          `;
        }

        // Receives from & Sends to built from edges that touch the focus directly
        const receives = [];
        const sends = [];

        (model.edges || []).forEach(e => {
          if (e.to === node.id) {
            const sender = model.nodes[e.from];
            const senderTitle = sender ? sender.title : e.from;
            receives.push({ id: e.from, title: senderTitle, data: e.data });
          }
          if (e.from === node.id) {
            const receiver = model.nodes[e.to];
            const receiverTitle = receiver ? receiver.title : e.to;
            sends.push({ id: e.to, title: receiverTitle, data: e.data });
          }
        });

        if (receives.length > 0) {
          html += `
            <div class="inspector-section">
              <h3>Called by</h3>
              <ul class="edge-list">
                ${receives.map(r => {
                  const rFiles = (window.VOCKPIT_CODE || {})[r.id] || [];
                  const rHasCode = rFiles.some(f => f.content !== null);
                  const codeBtn = rHasCode ? ` <button class="inspector-code-btn" onclick="window._vockpitShowCode('${escapeHtml(r.id)}',0)">code</button>` : '';
                  return `<li><a href="#/${r.id}">${escapeHtml(r.title)}</a>: ${escapeHtml(r.data)}${codeBtn}</li>`;
                }).join('')}
              </ul>
            </div>
          `;
        }

        if (sends.length > 0) {
          html += `
            <div class="inspector-section">
              <h3>Calls</h3>
              <ul class="edge-list">
                ${sends.map(s => {
                  const sFiles = (window.VOCKPIT_CODE || {})[s.id] || [];
                  const sHasCode = sFiles.some(f => f.content !== null);
                  const codeBtn = sHasCode ? ` <button class="inspector-code-btn" onclick="window._vockpitShowCode('${escapeHtml(s.id)}',0)">code</button>` : '';
                  return `<li><a href="#/${s.id}">${escapeHtml(s.title)}</a>: ${escapeHtml(s.data)}${codeBtn}</li>`;
                }).join('')}
              </ul>
            </div>
          `;
        }

        // Code section — shown when node has associated source files
        const nodeCode = node.code || [];
        const codeFiles = (window.VOCKPIT_CODE || {})[node.id] || [];
        if (nodeCode.length > 0) {
          const fileItems = nodeCode.map((p, i) => {
            const fname = p.split('/').pop();
            const hasContent = codeFiles[i] && codeFiles[i].content !== null;
            if (hasContent) {
              return '<button class="inspector-code-btn" onclick="window._vockpitShowCode(\'' + escapeHtml(node.id) + '\',' + i + ')">' + escapeHtml(fname) + '</button>';
            }
            return '<span class="tag" title="' + escapeHtml(p) + '">' + escapeHtml(fname) + '</span>';
          }).join(' ');
          html += `
            <div class="inspector-section">
              <h3>Code</h3>
              <div class="tag-list">${fileItems}</div>
              <p class="code-hint">Ctrl+click any node on the diagram to open its code.</p>
            </div>
          `;
        }

        // Prompt textarea (box nodes only)
        if (node.kind === 'box') {
          const savedPrompt = (() => { try { return localStorage.getItem('vockpit_prompt_' + node.id) || ''; } catch { return ''; } })();
          html += `
            <div class="inspector-section inspector-prompt-section">
              <h3>Suggest Changes</h3>
              <textarea class="prompt-textarea" data-node-id="${escapeHtml(node.id)}" placeholder="Describe what should change in this module...">${escapeHtml(savedPrompt)}</textarea>
            </div>
          `;
        }

        inspector.innerHTML = html;

        // Wire prompt auto-save
        const ta = inspector.querySelector('.prompt-textarea');
        if (ta) {
          ta.addEventListener('input', () => {
            try { localStorage.setItem('vockpit_prompt_' + ta.dataset.nodeId, ta.value); } catch {}
          });
        }
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      window.addEventListener('hashchange', render);
      render();

      // ── Code modal ──────────────────────────────────────────────────────
      // All DOM lookups are lazy (inside functions) because the modal HTML
      // is appended after this script tag and not yet in the DOM here.
      const codeData = window.VOCKPIT_CODE || {};

      function closeCodeModal() {
        const m = document.getElementById('code-modal');
        if (m) m.classList.remove('open');
      }

      function showCodeModal(nodeId, fileIndex) {
        const m = document.getElementById('code-modal');
        const titleEl = document.getElementById('code-modal-title');
        const tabsEl = document.getElementById('code-modal-tabs');
        const bodyEl = document.getElementById('code-modal-body');
        if (!m) return;

        const node = model && model.nodes && model.nodes[nodeId];
        const files = codeData[nodeId];
        if (!files || !files.length) return;

        titleEl.textContent = (node ? node.title : nodeId) + ' — source files';

        const startIdx = (typeof fileIndex === 'number' && fileIndex < files.length) ? fileIndex : 0;

        tabsEl.innerHTML = '';
        files.forEach((f, i) => {
          const tab = document.createElement('button');
          tab.className = 'code-tab' + (i === startIdx ? ' active' : '');
          tab.textContent = f.path.split('/').pop();
          tab.title = f.path;
          tab.addEventListener('click', () => {
            tabsEl.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            renderCodeFile(f, bodyEl);
          });
          tabsEl.appendChild(tab);
        });

        renderCodeFile(files[startIdx], bodyEl);
        m.classList.add('open');
      }

      function renderCodeFile(f, bodyEl) {
        if (!bodyEl) return;
        if (f.error || f.content === null) {
          bodyEl.innerHTML = '<div class="code-error-notice">' + escapeHtml(f.path) + ': ' + escapeHtml(f.error || 'could not read') + '</div>';
          return;
        }
        const lines = f.content.split('\n');
        const digits = String(lines.length).length;
        const html = lines.map((line, i) => {
          const num = String(i + 1).padStart(digits, ' ');
          return '<span class="code-line-num">' + num + '</span>' + escapeHtml(line);
        }).join('\n');
        bodyEl.innerHTML = '<pre>' + html + '</pre>';
      }

      // Wire up static buttons and backdrop clicks after DOM is ready
      window.addEventListener('DOMContentLoaded', () => {
        const m = document.getElementById('code-modal');
        if (m) {
          document.getElementById('code-modal-close').addEventListener('click', closeCodeModal);
          m.addEventListener('click', (e) => { if (e.target === m) closeCodeModal(); });
        }
        const cm = document.getElementById('changes-modal');
        if (cm) {
          document.getElementById('changes-modal-close').addEventListener('click', closeChangesModal);
          document.getElementById('copy-changes-btn').addEventListener('click', copyChangesPrompt);
          cm.addEventListener('click', (e) => { if (e.target === cm) closeChangesModal(); });
        }
        const pab = document.getElementById('process-all-btn');
        if (pab) pab.addEventListener('click', processAllChanges);
      });

      // Ctrl+click on SVG node → show code (doesn't navigate)
      content.addEventListener('click', (e) => {
        if (!e.ctrlKey && !e.metaKey) return;
        const link = e.target.closest('a[href]');
        if (!link) return;
        const href = link.getAttribute('href') || '';
        const nodeId = href.startsWith('#/') ? href.slice(2) : '';
        if (!nodeId) return;
        const files = codeData[nodeId];
        if (files && files.length) {
          e.preventDefault();
          showCodeModal(nodeId, 0);
        }
      });

      function renderCodeInline(nodeId) {
        const files = (window.VOCKPIT_CODE || {})[nodeId] || [];
        if (!files.length) {
          content.innerHTML = '<div class="missing-notice">No code files linked to this module.</div>';
          return;
        }
        let tabsHtml = '';
        if (files.length > 1) {
          tabsHtml = '<div class="code-inline-tabs">' +
            files.map((f, i) => '<button class="code-tab' + (i === 0 ? ' active' : '') + '" data-idx="' + i + '">' + escapeHtml(f.path.split('/').pop()) + '</button>').join('') +
            '</div>';
        }
        content.innerHTML = '<div class="code-inline-viewer">' + tabsHtml + '<div class="code-inline-body" id="code-inline-body-el"></div></div>';
        const bodyEl = document.getElementById('code-inline-body-el');
        const tabBtns = content.querySelectorAll('.code-inline-tabs .code-tab');
        function showInlineFile(idx) {
          tabBtns.forEach(t => t.classList.remove('active'));
          if (tabBtns[idx]) tabBtns[idx].classList.add('active');
          renderCodeFile(files[idx], bodyEl);
        }
        tabBtns.forEach((btn, i) => btn.addEventListener('click', () => showInlineFile(i)));
        showInlineFile(0);
      }

      function processAllChanges() {
        const nodes = model?.nodes || {};
        const parts = [];
        Object.values(nodes).forEach(n => {
          if (n.kind !== 'box') return;
          let prompt = '';
          try { prompt = localStorage.getItem('vockpit_prompt_' + n.id) || ''; } catch {}
          prompt = prompt.trim();
          if (!prompt) return;
          parts.push('## ' + n.title + ' (`' + n.id + '`)\n\n' + prompt);
        });
        if (!parts.length) {
          alert('No change suggestions entered yet.\nClick a module in the diagram, then enter your request in the sidebar.');
          return;
        }
        const sysNode = model.nodes[model.system];
        const consolidated = '# Change Request for ' + (sysNode ? sysNode.title : 'System') +
          '\n\nPlease apply the following changes to the codebase:\n\n' +
          parts.join('\n\n---\n\n') + '\n';
        const pre = document.getElementById('changes-modal-pre');
        const m = document.getElementById('changes-modal');
        if (pre) pre.textContent = consolidated;
        if (m) m.classList.add('open');
      }

      function closeChangesModal() {
        const m = document.getElementById('changes-modal');
        if (m) m.classList.remove('open');
      }

      function copyChangesPrompt() {
        const pre = document.getElementById('changes-modal-pre');
        const confirmEl = document.getElementById('copy-confirm');
        if (!pre) return;
        navigator.clipboard.writeText(pre.textContent).then(() => {
          if (confirmEl) { confirmEl.hidden = false; setTimeout(() => { confirmEl.hidden = true; }, 2000); }
        }).catch(() => {
          const range = document.createRange();
          range.selectNode(pre);
          window.getSelection().removeAllRanges();
          window.getSelection().addRange(range);
        });
      }

      // Expose showCodeModal for inspector buttons (called from onclick attr with file index)
      window._vockpitShowCode = showCodeModal;
    })();
  </script>

  <!-- Changes prompt modal -->
  <div id="changes-modal" role="dialog" aria-modal="true" aria-labelledby="changes-modal-title">
    <div id="changes-modal-box">
      <div id="changes-modal-header">
        <span id="changes-modal-title">Consolidated Change Request</span>
        <button id="changes-modal-close" aria-label="Close">&#x2715;</button>
      </div>
      <div id="changes-modal-actions">
        <button id="copy-changes-btn">Copy to Clipboard</button>
        <span id="copy-confirm" hidden>Copied!</span>
        <span id="changes-modal-hint">Paste into Claude Code terminal to apply changes</span>
      </div>
      <div id="changes-modal-body">
        <pre id="changes-modal-pre"></pre>
      </div>
    </div>
  </div>

  <!-- Code modal overlay -->
  <div id="code-modal" role="dialog" aria-modal="true" aria-labelledby="code-modal-title">
    <div id="code-modal-box">
      <div id="code-modal-header">
        <span id="code-modal-title"></span>
        <button id="code-modal-close" aria-label="Close">&#x2715;</button>
      </div>
      <div id="code-modal-tabs"></div>
      <div id="code-modal-body"></div>
    </div>
  </div>
</body>
</html>
