name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff mypy bandit[toml]

      - name: Ruff — lint
        run: ruff check src/ tests/

      - name: Ruff — format check
        run: ruff format --check src/ tests/

      - name: Mypy — type check
        run: mypy src/vockpit --ignore-missing-imports --strict

      - name: Bandit — security scan
        run: bandit -r src/vockpit -ll --exclude src/vockpit/assets

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v --tb=short

      - name: Check shop example model
        run: vockpit check --root examples/shop

      - name: Check Vockpit self-model
        run: vockpit check
